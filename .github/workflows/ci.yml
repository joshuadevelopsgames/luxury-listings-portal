name: CI

# Lightweight safety net: prove the app still compiles and the unit tests pass
# on every push / PR. Intentionally lenient (CI=false on the build) so the
# existing warning backlog does not block merges — it fails only on real
# compile errors and test failures.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npx react-scripts test --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          # Lenient: don't treat warnings as errors (matches how the site
          # actually deploys). Compile errors still fail the job.
          CI: false
          DISABLE_ESLINT_PLUGIN: true
